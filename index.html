<!DOCTYPE html>
<html lang="fr" data-theme="obsidienne">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preview — outil de développement web</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-6 -6 112 112'%3E%3Cpolygon points='0,0 22,0 50,48 78,0 100,0 100,100 80,100 80,40 50,88 20,40 20,100 0,100' fill='%23D4AF37'/%3E%3C/svg%3E">
<link rel="stylesheet" href="themes/mansur.css">
<link rel="stylesheet" href="themes/obsidienne.css">
<link rel="stylesheet" href="themes/albatre.css">
<link rel="stylesheet" href="themes/eclipse.css">
<link rel="stylesheet" href="themes/saphir.css">
<link rel="stylesheet" href="themes/grenat.css">
<link rel="stylesheet" href="themes/platine.css">
<link rel="stylesheet" href="themes/amethyste.css">
<link rel="stylesheet" href="themes/neon.css">
<link rel="stylesheet" href="themes/acide.css">
<link rel="stylesheet" href="themes/magma.css">
<link rel="stylesheet" href="themes/glitch.css">
<link rel="stylesheet" href="themes/outrun.css">
<link rel="stylesheet" href="themes/supernova.css">
<link rel="stylesheet" href="themes/polices-obsidienne.css">
<link rel="stylesheet" href="moteur/police-identite.css">
<link rel="stylesheet" href="moteur/lab.css">
</head>
<body>
<main id="scene" class="scene" data-fond="degrade">
  <div id="zone-effet" class="zone-effet"></div>
</main>
<div id="dock" class="dock" data-ouvert="oui">
<div class="dock-interieur">
  <div class="dock-barre" title="Glisser pour déplacer le menu">
    <button type="button" id="basculer-menu" class="dock-bouton" aria-expanded="true" aria-controls="menu-flottant" title="Ouvrir ou replier le menu">
      <svg class="icone icone-ouvert" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      <svg class="icone icone-ferme" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      <span class="visuellement-cache">Menu</span>
    </button>
    <span id="dock-marque" class="dock-marque" aria-hidden="true"></span>
    <button type="button" id="dock-titre" class="dock-titre" title="Ouvrir les réglages de l'effet">
      <span id="dock-effet" class="dock-effet"></span>
      <span id="dock-preset" class="dock-preset" hidden></span>
    </button>
    <span id="fps" class="fps" title="Images par seconde">--</span>
    <span class="poignee-deplacement" aria-hidden="true"><svg class="icone" viewBox="0 0 24 24"><circle cx="9" cy="6" r="1.3" class="plein"/><circle cx="15" cy="6" r="1.3" class="plein"/><circle cx="9" cy="12" r="1.3" class="plein"/><circle cx="15" cy="12" r="1.3" class="plein"/><circle cx="9" cy="18" r="1.3" class="plein"/><circle cx="15" cy="18" r="1.3" class="plein"/></svg></span>
  </div>
  <div id="menu-flottant" class="menu-flottant">
    <header class="identite-studio">
      <span id="identite-nom" class="identite-nom"></span>
      <span id="identite-ligne" class="identite-ligne"></span>
    </header>
    <nav class="onglets" role="tablist" aria-label="Sections du menu">
      <button type="button" role="tab" data-onglet="effets" aria-selected="true">
        <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>
        <span>Catalogue</span>
      </button>
      <button type="button" role="tab" data-onglet="affichage" aria-selected="false">
        <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4v16"/><path d="M12 4a8 8 0 0 1 0 16" class="plein"/></svg>
        <span>Thèmes</span>
      </button>
      <button type="button" role="tab" data-onglet="reglages" aria-selected="false">
        <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
        <span>Réglages</span>
      </button>
      <button type="button" role="tab" data-onglet="presets" aria-selected="false">
        <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10a1 1 0 0 1 1 1v15l-6-4-6 4V5a1 1 0 0 1 1-1z"/></svg>
        <span>Presets</span>
      </button>
      <button type="button" role="tab" data-onglet="partager" aria-selected="false">
        <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M8 8l4-4 4 4M5 13v6h14v-6"/></svg>
        <span>Partager</span>
      </button>
    </nav>
    <section class="contenu-onglet" data-panneau="effets" role="tabpanel">
      <div id="liste-effets" class="liste-effets"></div>
    </section>
    <section class="contenu-onglet" data-panneau="reglages" role="tabpanel" hidden>
      <div class="entete-reglages">
        <h1 id="titre-effet"></h1>
        <details class="a-propos">
          <summary>À propos de cet effet</summary>
          <p id="description-effet" class="note"></p>
        </details>
      </div>
      <div id="reglages" class="reglages"></div>
      <button type="button" id="reinitialiser" class="bouton bouton-large">↺ Tout remettre par défaut</button>
    </section>
    <section class="contenu-onglet" data-panneau="presets" role="tabpanel" hidden>
      <button type="button" id="sauver-preset" class="bouton bouton-principal">Sauvegarder le preset</button>
      <p id="etat-preset" class="note note-alerte" hidden>Modifications non sauvegardées.</p>
      <button type="button" id="sauver-sous" class="bouton bouton-discret" hidden>Enregistrer sous un autre nom…</button>
      <form id="form-preset" class="form-preset" hidden>
        <label for="nom-preset">Nom du preset</label>
        <input id="nom-preset" type="text" maxlength="60" autocomplete="off" required>
        <div class="actions">
          <button type="submit" class="bouton bouton-principal">Enregistrer</button>
          <button type="button" id="annuler-preset" class="bouton">Annuler</button>
        </div>
      </form>
      <div id="presets-effet" class="presets-effet"></div>
      <details id="tous-presets" class="tiroir">
        <summary>Tous les presets <span id="compte-presets" class="compte">0</span></summary>
        <input type="search" id="recherche-presets" placeholder="Rechercher un preset…" aria-label="Rechercher un preset" autocomplete="off" hidden>
        <div id="liste-presets" class="liste-presets"></div>
      </details>
      <details class="tiroir">
        <summary>Sauvegarde des presets</summary>
        <p id="etat-sauvegarde" class="note" hidden></p>
        <div class="actions actions-colonne">
          <button type="button" id="exporter-presets" class="bouton">Exporter mes presets</button>
          <button type="button" id="importer-appli" class="bouton" disabled>Importer la sauvegarde de l'appli</button>
          <button type="button" id="importer-fichier" class="bouton">Importer depuis un fichier…</button>
          <input type="file" id="fichier-presets" accept=".json,application/json" hidden>
        </div>
      </details>
    </section>
    <section class="contenu-onglet" data-panneau="affichage" role="tabpanel" hidden>
      <h2>Thème</h2>
      <div id="choix-theme" class="choix-theme"></div>
      <label class="ligne-interrupteur">
        <span>Réduire les animations</span>
        <input type="checkbox" id="reduire" class="interrupteur">
      </label>
      <p id="note-systeme" class="note" hidden>Votre système demande moins d'animations : les visiteurs dans ce cas voient la version réduite. Le lab, lui, s'ouvre en version complète.</p>
      <h2>Qualité d'affichage</h2>
      <div id="choix-qualite" class="groupe"></div>
      <p id="note-qualite" class="note"></p>
      <h2 class="seulement-ordinateur">Menu</h2>
      <button type="button" id="replacer-menu" class="bouton bouton-large seulement-ordinateur">
        <strong>Replacer le menu</strong><span>Remet le menu en haut à gauche, à sa taille d'origine.</span>
      </button>
      <button type="button" id="rejouer-splash" class="bouton bouton-large">
        <strong>Rejouer le splash art</strong><span>Le rejoue par-dessus l'effet affiché.</span>
      </button>
    </section>
    <section class="contenu-onglet" data-panneau="partager" role="tabpanel" hidden>
      <button type="button" id="copier-reglages" class="bouton bouton-large">
        <strong>Copier les réglages</strong><span>Les réglages au format texte.</span>
      </button>
      <button type="button" id="copier-lien" class="bouton bouton-large">
        <strong>Copier le lien</strong><span>Rouvre le lab avec ces réglages.</span>
      </button>
      <button type="button" id="copier-code" class="bouton bouton-large">
        <strong>Copier le code de l'effet</strong><span>Prêt à coller dans un autre site.</span>
      </button>
      <button type="button" id="copier-rapport" class="bouton bouton-large">
        <strong>Copier le rapport de performance</strong><span>Fluidité mesurée, niveau de qualité, machine.</span>
      </button>
    </section>
    <button type="button" id="poignee-taille" class="poignee-taille" title="Glisser pour agrandir ou réduire le menu">
      <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10L10 20M20 15l-5 5M20 4L4 20"/></svg>
      <span class="visuellement-cache">Agrandir ou réduire le menu</span>
    </button>
  </div>
</div>
</div>
<div id="message" class="message" role="status" aria-live="polite"></div>
<script src="moteur/registre.js"></script>
<script src="moteur/qualite.js"></script>
<script src="moteur/identite.js"></script>
<script src="moteur/presets-utilisateur.js"></script>
<script src="moteur/sauvegarde-presets.js"></script>
<script src="effets/dissolve.js"></script>
<script src="effets/rouleau.js"></script>
<script src="effets/hero-v.js"></script>
<script src="effets/maillot.js"></script>
<script src="effets/pixel-scan.js"></script>
<script src="effets/cartes-joueurs.js"></script>
<script src="effets/maillot-cartes.js"></script>
<script src="effets/mansur-joueurs.js"></script>
<script src="effets/mansur-joueurs-v2.js"></script>
<script src="effets/selection-joueurs.js"></script>
<script src="effets/table-tactique.js"></script>
<script src="effets/entree-arene.js"></script>
<script src="effets/nav-bandeau.js"></script>
<script src="effets/nav-rail.js"></script>
<script src="effets/nav-jeu.js"></script>
<script src="effets/nav-bandeau-ecusson.js"></script>
<script src="effets/nav-bandeau-capsule.js"></script>
<script src="effets/nav-bandeau-diffusion.js"></script>
<script src="effets/voile-accueil.js"></script>
<script src="themes/themes.js"></script>
<script src="presets/presets.js"></script>
<script src="presets/sauvegarde-presets.js"></script>
<script src="moteur/lab.js"></script>
</body>
</html>
